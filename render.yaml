services:
  - type: web
    name: spiflix-core
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm --filter @spiflix/shared build && pnpm --filter @spiflix/core build
    startCommand: node packages/core/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        sync: false
      - key: PROXY_SIGNING_SECRET
        sync: false
      # Optional. During a secret rotation, set this to the OLD secret so
      # already-issued proxy URLs keep verifying until they expire, then clear
      # it. Leave empty in normal operation.
      - key: PROXY_SIGNING_SECRET_PREVIOUS
        sync: false
      - key: PROXY_ALLOWED_HOSTS
        sync: false
