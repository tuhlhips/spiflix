<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spiflix — Stream movies and TV shows</title>
    <meta name="description" content="Thousands of movies and TV shows, streamed free. Watch together in sync with friends." />
    <!-- Discord tints an embed's left stripe with this, so it tracks the brand accent. -->
    <meta name="theme-color" content="#e92a34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews (Discord, Telegram, iMessage, Slack, WhatsApp, Twitter).
         Crawlers don't execute JS, so these static tags are all they ever see —
         the per-title og:* that usePresenceMeta sets at runtime never reaches
         them. Every route therefore shares this one preview. URLs must be
         absolute; relative paths are silently dropped by most scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spiflix" />
    <meta property="og:title" content="Spiflix — Stream movies and TV shows" />
    <meta property="og:description" content="Thousands of movies and TV shows, streamed free. Watch together in sync with friends." />
    <meta property="og:url" content="https://spiflix.online/" />
    <meta property="og:image" content="https://spiflix.online/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spiflix — stream movies and TV shows" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spiflix — Stream movies and TV shows" />
    <meta name="twitter:description" content="Thousands of movies and TV shows, streamed free. Watch together in sync with friends." />
    <meta name="twitter:image" content="https://spiflix.online/og.png" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Manifest is generated and injected by vite-plugin-pwa (manifest.webmanifest);
         a second hand-written manifest here pointed at icons that didn't exist. -->
  </head>
  <body class="min-h-screen bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
